name: OpenPassport CI/CD
on:
  push:
    # branches:
    #   - main
    # paths:
    #   - "src"
jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Artifacts
        run: |
          ARTIFACT_URL=$(curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/nesopie/openpassport/actions/artifacts" \
            | jq -r '.artifacts[0].archive_download_url')

          echo "ARTIFACT_URL=$ARTIFACT_URL" >> $GITHUB_ENV
      - name: Download artifact
        run: |
          curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o artifact.zip "$ARTIFACT_URL"
      - name: Init submodules
        run: |
          git submodule update --init
          cd rapidsnark && git submodule update --init && cd ..

      # build the docker image
      - name: Build Docker image
        run: |
          sudo docker build --build-arg PROOFTYPE=register -f Dockerfile.tee.actions -t tee-server-register .
          sudo docker build --build-arg PROOFTYPE=disclose -f Dockerfile.tee.actions -t tee-server-disclose .
          sudo docker build --build-arg PROOFTYPE=dsc -f Dockerfile.tee.actions -t tee-server-dsc .

      # build the eif
      - name: Build eifs
        run: |
          mkdir measurements
          touch measurements/register.log
          touch measurements/disclose.log
          touch measurements/dsc.log
          sudo nitro-cli build-enclave --docker-uri tee-server-reggister --output-file prover-server.eif | measurements/register.log
          sudo nitro-cli build-enclave --docker-uri tee-server-disclose --output-file prover-server.eif | measurements/register.log
          sudo nitro-cli build-enclave --docker-uri tee-server-dsc --output-file prover-server.eif | measurements/register.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tee-measurements.log
          path: tee-measurements.log
