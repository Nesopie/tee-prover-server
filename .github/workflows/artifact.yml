name: OpenPassport CI/CD
on:
  push:
    # branches:
    #   - main
    # paths:
    #   - "src"
jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Artifacts
        run: |
          ARTIFACT_URL=$(curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/nesopie/openpassport/actions/artifacts" \
            | jq -r '.artifacts[0].archive_download_url')

          echo "ARTIFACT_URL=$ARTIFACT_URL" >> $GITHUB_ENV
      - name: Download artifact
        run: |
          curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o artifact.zip "$ARTIFACT_URL"

      # build the docker image
      - name: Build Docker image
        run: docker build -t tee-server .

      # build the eif
      - name: Build eif
        run: |
          sudo nitro-cli build-enclave --docker-uri tee-server --output-file prover-server.eif | tee-measurements.log

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: tee-measurements.log
          path: tee-measurements.log
