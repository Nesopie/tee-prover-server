name: OpenPassport CI/CD
on:
  push:
    # branches:
    #   - main
    # paths:
    #   - "src"
jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Artifacts
        run: |
          ARTIFACT_URL=$(curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/nesopie/openpassport/actions/artifacts" \
            | jq -r '.artifacts[0].archive_download_url')

          echo "ARTIFACT_URL=$ARTIFACT_URL" >> $GITHUB_ENV
      - name: Download artifact
        run: |
          curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o artifact.zip "$ARTIFACT_URL"
      - name: Init submodules
        run: |
          git submodule update --init
          cd rapidsnark && git submodule update --init && cd ..

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # - name: Build and push Docker register docker image
      #   uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
      #   with:
      #     context: .
      #     file: ./Dockerfile.tee.actions
      #     push: true
      #     tags: ${{ secrets.DOCKER_USERNAME }}/tee-server-register:latest
      #     build-args: |
      #       PROOFTYPE=register
      # - name: Build and push Docker register docker image
      #   uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
      #   with:
      #     context: .
      #     file: ./Dockerfile.tee.actions
      #     push: true
      #     tags: ${{ secrets.DOCKER_USERNAME }}/tee-server-disclose:latest
      #     build-args: |
      #       PROOFTYPE=disclose

      # - name: Build and push Docker register docker image
      #   uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
      #   with:
      #     context: .
      #     file: ./Dockerfile.tee.actions
      #     push: true
      #     tags: ${{ secrets.DOCKER_USERNAME }}/tee-server-dsc:latest
      #     build-args: |
      #       PROOFTYPE=dsc

      - name: Build Docker image
        run: |
          sudo docker build --build-arg PROOFTYPE=register -f Dockerfile.tee.actions -t nesopie/tee-server-register:latest .
          sudo docker build --build-arg PROOFTYPE=disclose -f Dockerfile.tee.actions -t nesopie/tee-server-disclose:latest .
          sudo docker build --build-arg PROOFTYPE=dsc      -f Dockerfile.tee.actions -t nesopie/tee-server-dsc:latest .

      - name: Push docker images
        run: |
          sudo docker push nesopie/tee-server-register:latest
          sudo docker push nesopie/tee-server-disclose:latest
          sudo docker push nesopie/tee-server-dsc:latest

      # build the eif
      - name: Build eifs
        run: |
          mkdir measurements
          touch measurements/register.log
          touch measurements/disclose.log
          touch measurements/dsc.log
          sudo nitro-cli build-enclave --docker-uri ${{ secrets.DOCKER_USERNAME }}/tee-server-reggister --output-file prover-server-register.eif | measurements/register.log
          sudo nitro-cli build-enclave --docker-uri ${{ secrets.DOCKER_USERNAME }}/tee-server-disclose --output-file prover-server-disclose.eif | measurements/register.log
          sudo nitro-cli build-enclave --docker-uri ${{ secrets.DOCKER_USERNAME }}/tee-server-dsc --output-file prover-server-dsc.eif | measurements/register.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tee-measurements.log
          path: tee-measurements.log
